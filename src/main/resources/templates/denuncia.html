<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Denúncia | Denúncia Digital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">
            <span>🛡️</span> Denúncia Digital
        </div>
        <nav>
            <a th:href="@{/}">Início</a>
            <a th:href="@{/denuncia}">Denunciar</a>
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/info}">Direitos</a>
        </nav>
    </div>
</header>

<section class="secao">
    <div class="container">
        <div class="secao-titulo">
            <h2>Denúncia Anônima</h2>
            <p>Seus dados não são coletados. Contribua de forma segura.</p>
        </div>

        <div class="form-container">
            <div th:if="${sucesso}" class="alerta sucesso" th:text="${sucesso}"></div>

            <form th:action="@{/denuncia}" th:object="${denuncia}" method="post">

                <div class="form-group">
                    <label>Faixa etária</label>
                    <select th:field="*{faixaEtaria}" required>
                        <option value="">Selecione</option>
                        <option value="18-25">18 a 25 anos</option>
                        <option value="26-30">26 a 30 anos</option>
                        <option value="31-38">31 a 38 anos</option>
                        <option value="39-45">39 a 45 anos</option>
                        <option value="46-55">46 a 55 anos</option>
                        <option value="Acima de 55">Acima de 55 anos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Período que mais usa a internet</label>
                    <select th:field="*{periodoUso}" required>
                        <option value="">Selecione</option>
                        <option value="Manhã">Manhã</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Noite">Noite</option>
                        <option value="Madrugada">Madrugada</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipo principal de violação</label>
                    <select th:field="*{tipoViolacao}" required>
                        <option value="">Selecione</option>
                        <option value="Violação de Privacidade">Violação de Privacidade</option>
                        <option value="Cyberbullying / Assédio">Cyberbullying / Assédio</option>
                        <option value="Discurso de Ódio">Discurso de Ódio</option>
                        <option value="Ciberataque / Golpe">Ciberataque / Golpe</option>
                        <option value="Restrição de Liberdade de Expressão">Restrição de Liberdade de Expressão</option>
                        <option value="Desinformação">Desinformação</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Você sabe como denunciar uma violação de direitos digitais?</label>
                    <select th:field="*{sabeDenunciar}" required>
                        <option value="">Selecione</option>
                        <option value="Sim, sei perfeitamente">Sim, sei perfeitamente</option>
                        <option value="Sei mais ou menos">Sei mais ou menos</option>
                        <option value="Não sei">Não sei</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Já buscou apoio jurídico ou psicológico por causa de algo online?</label>
                    <select th:field="*{buscouApoio}" required>
                        <option value="">Selecione</option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                        <option value="Nunca precisei">Nunca precisei</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Em uma escala de 1 a 5, o quanto você se sente seguro(a) no ambiente digital?</label>
                    <select th:field="*{sensacaoSeguranca}" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Nada seguro</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5 - Totalmente seguro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Relato anônimo (opcional)</label>
                    <textarea th:field="*{relato}" rows="4" placeholder="Descreva brevemente o que aconteceu (sem se identificar)"></textarea>
                </div>

                <button type="submit" class="botao principal" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Enviar Denúncia Anônima
                </button>
            </form>
        </div>
    </div>
</section>

<footer>
    <p>
        <strong>Projeto Extensionista</strong> — Tema Integrador V<br>
        Direitos Humanos e o Universo Digital | ODS 16
    </p>
</footer>

</body>
</html>
